[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files", args = ["--maxkb=512"] },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "detect-private-key" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "swiftformat", name = "SwiftFormat", language = "system", entry = "swiftformat --lint", files = '\\.swift$', pass_filenames = true },
  { id = "swiftlint", name = "SwiftLint", language = "system", entry = "swiftlint lint --strict --quiet", files = '\\.swift$', pass_filenames = true },
  { id = "swift-build", name = "Swift Build", language = "system", entry = "bash -c 'cd packages/MarkdownEngine && swift build'", always_run = true, pass_filenames = false },
]
